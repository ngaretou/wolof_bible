name: wolof_bible
description: Wolof Bible app for desktop and web from USFM files.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.1.1+28

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.2
  system_theme: ^3.1.2
  window_manager: ^0.5.1
  flutter_acrylic: ^1.1.4
  url_strategy: ^0.3.0
  url_launcher: ^6.1.9
  share_plus: ^13.0.0
  # clipboard: ^3.0.14
  fluent_ui: ^4.14.0
  hive: ^2.2.1
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  xml: ^6.1.0
  # just_audio: ^0.9.24
  # audio_session: ^0.1.6+1
  firebase_core: ^4.2.1
  firebase_analytics: ^12.0.4
  scrollable_positioned_list: ^0.3.2
  google_fonts: ^8.0.2

  flutter_html: ^3.0.0-alpha.6
  flutter_native_splash: ^2.3.7
  diacritic: ^0.1.3
  universal_html: ^2.0.8
  pwa_install: ^0.0.5
  package_info_plus: ^10.0.0
  path_provider: ^2.1.1
  snowball_stemmer: ^0.1.0
  skeletonizer: ^2.1.0+1
  collection: ^1.19.1
  rxdart: ^0.28.0
  macos_window_utils: ^1.9.1
  macos_ui: ^2.2.2
  http: ^1.6.0
  auto_suggest_box: ^1.8.1
  # just_audio: ^0.10.5
  # audio_session: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.1.11
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  msix: ^3.7.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path_ios: "assets/images/app-logo-apple.png"
  remove_alpha_ios: true
  image_path: "assets/images/app-logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/app-logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/app-logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/app-logo-apple.png"

# The following section is specific to Flutter packages.
